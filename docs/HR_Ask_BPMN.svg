<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" role="img" aria-labelledby="title desc">
  <title id="title">HR Ask BPMN workflow</title>
  <desc id="desc">A BPMN-style process diagram for HR-Ask. It shows input validation, policy retrieval, safe intent routing, ticket drafting, validation, clarification, and escalation to HR.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker>
    <style>
      .label{font-family:Arial,sans-serif;font-size:19px;fill:#111;text-anchor:middle}.small{font-family:Arial,sans-serif;font-size:16px;fill:#111;text-anchor:middle}.note{font-family:Arial,sans-serif;font-size:16px;fill:#111}.line{stroke:#111;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.box{fill:#fff;stroke:#111;stroke-width:2.4}.gateway{fill:#f2f2f2;stroke:#111;stroke-width:2.4}.event{fill:#fff;stroke:#111;stroke-width:3}.end{fill:#111;stroke:#111;stroke-width:3}.lane{fill:none;stroke:#777;stroke-width:1.5}.caption{font-family:Arial,sans-serif;font-size:29px;font-weight:bold;fill:#111}.laneTitle{font-family:Arial,sans-serif;font-size:18px;font-weight:bold;fill:#111}
    </style>
  </defs>
  <rect width="1800" height="980" fill="white"/>
  <text x="900" y="42" class="caption" text-anchor="middle">HR-Ask BPMN Workflow</text>
  <text x="900" y="68" class="small">Fictional policy consultation and unsubmitted request drafting</text>

  <!-- Lanes -->
  <rect x="40" y="100" width="1720" height="230" class="lane"/>
  <rect x="40" y="330" width="1720" height="500" class="lane"/>
  <rect x="40" y="830" width="1720" height="110" class="lane"/>
  <text x="62" y="125" class="laneTitle" text-anchor="start">Employee</text>
  <text x="62" y="355" class="laneTitle" text-anchor="start">HR-Ask application</text>
  <text x="62" y="855" class="laneTitle" text-anchor="start">Human HR</text>

  <!-- Employee -->
  <circle cx="170" cy="215" r="30" class="event"/><text x="170" y="220" class="small">Start</text>
  <rect x="260" y="175" width="220" height="80" rx="10" class="box"/><text x="370" y="207" class="label">Submit HR question</text><text x="370" y="231" class="small">or draft request</text>
  <path d="M200 215 H260" class="line"/>

  <!-- Main application flow -->
  <rect x="550" y="390" width="210" height="82" rx="10" class="box"/><text x="655" y="422" class="label">Validate input</text><text x="655" y="447" class="small">text and length</text>
  <rect x="825" y="390" width="230" height="82" rx="10" class="box"/><text x="940" y="422" class="label">Normalize and retrieve</text><text x="940" y="447" class="small">policy evidence</text>
  <rect x="1120" y="390" width="205" height="82" rx="10" class="box"/><text x="1222" y="422" class="label">Classify intent</text><text x="1222" y="447" class="small">local safety rules</text>
  <path d="M480 215 V431 H550" class="line"/>
  <path d="M760 431 H825" class="line"/><path d="M1055 431 H1120" class="line"/>

  <!-- Escalate? -->
  <path d="M1430 385 L1480 431 L1430 477 L1380 431 z" class="gateway"/><text x="1430" y="426" class="small">Escalate?</text><text x="1430" y="447" class="small">unsafe or unsupported</text>
  <path d="M1325 431 H1380" class="line"/>
  <text x="1353" y="417" class="small">yes/no</text>

  <!-- clarify route -->
  <path d="M1430 477 V555" class="line"/><text x="1452" y="525" class="small">no</text>
  <path d="M1380 600 L1430 555 L1480 600 L1430 645 z" class="gateway"/><text x="1430" y="595" class="small">Clarify?</text>
  <path d="M1430 555 V555" class="line"/>

  <!-- consult/draft split -->
  <path d="M1430 645 V710" class="line"/><text x="1453" y="683" class="small">no</text>
  <path d="M1380 755 L1430 710 L1480 755 L1430 800 z" class="gateway"/><text x="1430" y="751" class="small">Draft?</text>
  <path d="M1430 710 V710" class="line"/>

  <!-- escalation and HR -->
  <path d="M1430 385 V295 H1510" class="line"/><text x="1452" y="330" class="small">yes</text>
  <rect x="1510" y="255" width="190" height="80" rx="10" class="box"/><text x="1605" y="287" class="label">Escalate to HR</text><text x="1605" y="312" class="small">formal channel</text>
  <path d="M1605 335 V875" class="line"/>
  <circle cx="1605" cy="900" r="22" class="end"/><text x="1642" y="906" class="note">End</text>

  <!-- clarification -->
  <path d="M1480 600 H1575" class="line"/><text x="1526" y="586" class="small">yes</text>
  <rect x="1575" y="560" width="165" height="80" rx="10" class="box"/><text x="1657" y="592" class="label">Request</text><text x="1657" y="616" class="small">clarification</text>
  <path d="M1657 640 V875" class="line"/><circle cx="1657" cy="900" r="22" class="end"/><text x="1692" y="906" class="note">End</text>

  <!-- consultation -->
  <path d="M1380 755 H1070" class="line"/><text x="1245" y="741" class="small">no: consultation</text>
  <rect x="840" y="715" width="230" height="80" rx="10" class="box"/><text x="955" y="747" class="label">Return grounded</text><text x="955" y="771" class="small">policy answer and citations</text>
  <path d="M955 795 V875" class="line"/><circle cx="955" cy="900" r="22" class="end"/><text x="991" y="906" class="note">End</text>

  <!-- draft flow -->
  <path d="M1430 800 V815 H735" class="line"/><text x="1075" y="801" class="small">yes</text>
  <rect x="500" y="775" width="235" height="80" rx="10" class="box"/><text x="617" y="807" class="label">Extract five fields</text><text x="617" y="831" class="small">from user-supplied text</text>
  <path d="M500 815 H430" class="line"/>
  <path d="M330 770 L380 815 L330 860 L280 815 z" class="gateway"/><text x="330" y="810" class="small">All fields</text><text x="330" y="831" class="small">valid?</text>
  <path d="M280 815 H160" class="line"/><text x="220" y="801" class="small">no</text>
  <rect x="70" y="775" width="90" height="80" rx="10" class="box"/><text x="115" y="807" class="small">Keep null</text><text x="115" y="831" class="small">and ask</text>
  <path d="M115 855 V875" class="line"/><circle cx="115" cy="900" r="22" class="end"/><text x="150" y="906" class="note">End</text>
  <path d="M330 770 V690 H505" class="line"/><text x="351" y="729" class="small">yes</text>
  <rect x="505" y="650" width="250" height="80" rx="10" class="box"/><text x="630" y="682" class="label">Return unsubmitted</text><text x="630" y="706" class="small">validated ticket draft</text>
  <path d="M630 730 V875" class="line"/><circle cx="630" cy="900" r="22" class="end"/><text x="666" y="906" class="note">End</text>

  <!-- Optional model note -->
  <rect x="815" y="515" width="315" height="105" rx="10" fill="#f7f7f7" stroke="#555" stroke-width="1.7" stroke-dasharray="6 4"/>
  <text x="972" y="545" class="label">Optional grounded LLM generation</text><text x="972" y="570" class="small">only after retrieval; citations are</text><text x="972" y="592" class="small">validated locally and cannot bypass rules</text>
  <path d="M1120 472 C1070 505 1050 520 1130 555" stroke="#555" stroke-width="1.7" fill="none" stroke-dasharray="6 4"/>
</svg>
